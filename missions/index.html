<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="version" content="1.0">
    <meta name="viewport"
        content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SFlightX Map</title>
    <link rel="icon" type="image/png" href="https://sflightx.com/resources/v4/database/logo/logo.png">

    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3847112193670696"
        crossorigin="anonymous"></script>

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <!-- Global & Page-Specific Stylesheets -->
    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css" />

    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #e6e1e5;
            -webkit-tap-highlight-color: transparent;
        }

        #globe {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Mobile Toggle Button for HUD */
        .hud-toggle-btn {
            display: none;
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 20;
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        /* HUD Control Panel overlay */
        .hud-overlay {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
            max-height: calc(100vh - 2rem);
            width: 320px;
            box-sizing: border-box;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .hud-card {
            background: rgba(15, 15, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1rem;
            color: #fff;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            width: 100%;
        }

        .hud-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 0.4rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--md-sys-color-primary, #d0bcff);
        }

        .hud-stats {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-bottom: 0.75rem;
        }

        /* Search input styling */
        .search-box {
            position: relative;
            margin-bottom: 0.75rem;
        }

        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0.6rem 0.8rem 0.6rem 2.4rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--md-sys-color-primary, #d0bcff);
        }

        .search-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }

        .filter-group {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--md-sys-color-primary, #6750A4);
            border-color: var(--md-sys-color-primary, #6750A4);
        }

        /* Quick Landmarks List inside HUD */
        .landmark-list {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            padding-right: 2px;
        }

        .landmark-list::-webkit-scrollbar {
            width: 4px;
        }

        .landmark-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .landmark-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .landmark-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Marker Custom Styling */
        .landmark-marker {
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .landmark-marker:hover {
            transform: scale(1.3);
            z-index: 100;
        }

        .marker-icon-container {
            font-size: 22px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
        }

        .marker-label {
            font-size: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            margin-top: 2px;
            pointer-events: none;
        }

        /* Custom Modal Dialog Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 1rem;
            box-sizing: border-box;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #1c1b1f;
            color: #e6e1e5;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 1.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.25s ease;
            box-sizing: border-box;
        }

        .modal-overlay.open .modal-card {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .badge-stock {
            background: rgba(255, 204, 0, 0.15);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .badge-custom {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .modal-desc {
            font-size: 0.9rem;
            line-height: 1.4;
            opacity: 0.9;
            margin-bottom: 0.75rem;
        }

        .modal-coords {
            font-family: monospace;
            font-size: 0.75rem;
            opacity: 0.6;
            margin-bottom: 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.4rem;
            border-radius: 8px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        /* Toast notification feedback */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #332d41;
            color: #e6e1e5;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            z-index: 200;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive Breakpoints for Mobile Phones */
        @media (max-width: 768px) {
            .hud-toggle-btn {
                display: flex;
            }

            .hud-overlay {
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                background: rgba(0, 0, 0, 0.85);
                backdrop-filter: blur(20px);
                padding: 5rem 1.25rem 2rem 1.25rem;
                transform: translateX(-100%);
                opacity: 0;
                pointer-events: none;
                overflow-y: auto;
            }

            .hud-overlay.mobile-open {
                transform: translateX(0);
                opacity: 1;
                pointer-events: auto;
            }

            .hud-card {
                background: rgba(25, 25, 32, 0.9);
                width: 100%;
            }

            .landmark-list {
                max-height: 220px;
            }

            /* Anchor modal to bottom on phones */
            .modal-overlay {
                align-items: flex-end;
                padding: 0;
            }

            .modal-card {
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                border-top-left-radius: 28px;
                border-top-right-radius: 28px;
                padding: 1.75rem 1.25rem 2.25rem 1.25rem;
                transform: translateY(100%);
            }

            .modal-overlay.open .modal-card {
                transform: translateY(0);
            }
        }
    </style>
    <script src="//unpkg.com/globe.gl"></script>
</head>

<body>
    <!-- Mobile HUD Toggle Button -->
    <button class="hud-toggle-btn" id="hudToggleBtn" onclick="toggleMobileHUD()">
        <span class="material-symbols-rounded">menu_open</span>
    </button>

    <!-- HUD Controls Overlay -->
    <div class="hud-overlay" id="hudOverlay">
        <div class="hud-card">
            <h3 class="hud-title">
                <span class="material-symbols-rounded">public</span> Droo Interactive Map
            </h3>
            <div class="hud-stats" id="landmarkCount">Loading landmarks...</div>

            <!-- Live Search Bar -->
            <div class="search-box">
                <span class="material-symbols-rounded search-icon">search</span>
                <input type="text" class="search-input" id="searchInput" placeholder="Search landmarks..."
                    oninput="handleSearch()">
            </div>

            <div style="font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem;">Filter:</div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="filterMarkers('all', this)">All</button>
                <button class="filter-btn" onclick="filterMarkers('stock', this)">Stock</button>
                <button class="filter-btn" onclick="filterMarkers('custom', this)">Custom</button>
            </div>

            <div style="font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem;">Quick Navigation:</div>
            <div class="landmark-list" id="landmarkList">
                <!-- Populated dynamically via JS -->
            </div>
        </div>

        <div class="hud-card"
            style="padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem;">Auto-Rotate Globe</span>
            <md-switch id="rotateToggle" selected></md-switch>
        </div>
    </div>

    <!-- Globe Container -->
    <div id="globe"></div>

    <!-- Custom Info Modal Dialog -->
    <div class="modal-overlay" id="infoModal" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Landmark Name</h3>
                <button class="modal-close" onclick="closeModal()">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>
            <div>
                <span class="modal-badge" id="modalBadge">Stock</span>
            </div>
            <p class="modal-desc" id="modalDesc">Description goes here.</p>
            <div class="modal-coords" id="modalCoords">Lat: 0.00, Lng: 0.00</div>
            <div class="modal-footer">
                <md-outlined-button onclick="copyCoordinates()">Copy Coords</md-outlined-button>
                <md-filled-button onclick="closeModal()">Close</md-filled-button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastMessage">Coordinates copied to clipboard!</div>

    <script>
        let allLandmarks = [];
        let activeFilter = 'all';
        let currentSelectedLandmark = null;
        const MAP_WIDTH = 1872;
        const MAP_HEIGHT = 936;
        const LNG_OFFSET = 180;

        const world = Globe()(document.getElementById('globe'))
            .globeImageUrl('https://sflightx.com/resources/v4/database/image/map_sflightx_com/droo_2k.png')
            .backgroundColor('#000000')
            .showAtmosphere(true)
            .atmosphereColor('#00ffff')
            .atmosphereAltitude(0.15);

        // Enable auto-rotation by default
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.8;
        // Logs exact pixel coordinates (X, Y) anywhere you click on the globe map
        /*world.onGlobeClick(({ lat, lng }) => {
            // Convert lat/lng back to the 1872x936 pixel map scale
            const pixelX = Math.round(((lng + 180) / 360) * MAP_WIDTH);
            const pixelY = Math.round(((90 - lat) / 180) * MAP_HEIGHT);

            console.log(`Map Pixel Coords -> X: ${pixelX}, Y: ${pixelY} | (JSON format: [${-pixelY}, ${pixelX}])`);
        });*/

        document.getElementById('rotateToggle').addEventListener('change', (e) => {
            world.controls().autoRotate = e.target.selected;
        });

        fetch('https://sflightx.com/resources/v4/database/map/landmarks.json')
            .then(res => res.json())
            .then(landmarks => {
                allLandmarks = landmarks.map(d => {
                    let lng = (d.coords[1] / MAP_WIDTH) * 360 - 180;
                    lng += LNG_OFFSET;
                    if (lng > 180) lng -= 360;
                    if (lng < -180) lng += 360;

                    return {
                        ...d,
                        lat: -((d.coords[0] / MAP_HEIGHT) * 180 - 90),
                        lng: lng,
                        color: d.mode === 'stock' ? '#ffcc00' : '#00ffff'
                    };
                });

                updateLandmarkDisplay(allLandmarks);
                populateLandmarkList(allLandmarks);
                document.getElementById('landmarkCount').innerText = `Total Landmarks: ${allLandmarks.length}`;
            })
            .catch(err => {
                console.error("Failed to load landmarks:", err);
                document.getElementById('landmarkCount').innerText = 'Failed to load landmarks data.';
            });

        function updateLandmarkDisplay(data) {
            world
                .htmlElementsData(data)
                .htmlElement(d => {
                    const el = document.createElement('div');
                    el.className = 'landmark-marker';

                    el.innerHTML = `
                        <div class="marker-icon-container" style="color: ${d.color};">
                            <span class="material-symbols-rounded">location_on</span>
                        </div>
                        <div class="marker-label">${d.name}</div>
                    `;

                    el.onclick = () => focusLandmark(d);
                    return el;
                });
        }

        function populateLandmarkList(data) {
            const listContainer = document.getElementById('landmarkList');
            listContainer.innerHTML = '';

            if (data.length === 0) {
                listContainer.innerHTML = '<div style="font-size: 0.8rem; opacity: 0.5; text-align: center; padding: 0.5rem;">No landmarks found</div>';
                return;
            }

            data.forEach(d => {
                const item = document.createElement('div');
                item.className = 'landmark-item';
                item.innerHTML = `
                    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;">${d.name}</span>
                    <span style="font-size: 0.7rem; opacity: 0.6; text-transform: uppercase;">${d.mode}</span>
                `;
                item.onclick = () => {
                    focusLandmark(d, true);
                    if (window.innerWidth <= 768) toggleMobileHUD(); // Auto close drawer on mobile selection
                };
                listContainer.appendChild(item);
            });
        }

        function focusLandmark(d, flyTo = false) {
            currentSelectedLandmark = d;
            openModal(d);

            if (flyTo) {
                world.controls().autoRotate = false;
                document.getElementById('rotateToggle').selected = false;
                world.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.2 }, 1000);
            }
        }

        function filterMarkers(type, btnElement) {
            activeFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            applySearchAndFilter();
        }

        function handleSearch() {
            applySearchAndFilter();
        }

        function applySearchAndFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allLandmarks.filter(d => {
                const matchesType = (activeFilter === 'all' || d.mode === activeFilter);
                const matchesQuery = d.name.toLowerCase().includes(query) || (d.description && d.description.toLowerCase().includes(query));
                return matchesType && matchesQuery;
            });

            updateLandmarkDisplay(filtered);
            populateLandmarkList(filtered);
        }

        function toggleMobileHUD() {
            const hud = document.getElementById('hudOverlay');
            const icon = document.querySelector('#hudToggleBtn span');
            hud.classList.toggle('mobile-open');
            icon.innerText = hud.classList.contains('mobile-open') ? 'close' : 'menu_open';
        }

        function openModal(d) {
            document.getElementById('modalTitle').innerText = d.name;
            document.getElementById('modalDesc').innerText = d.description || "No description provided for this landmark.";
            document.getElementById('modalCoords').innerText = `Latitude: ${d.lat.toFixed(4)}° | Longitude: ${d.lng.toFixed(4)}°`;

            const badge = document.getElementById('modalBadge');
            badge.innerText = d.mode || 'Unknown';
            badge.className = `modal-badge badge-${d.mode === 'stock' ? 'stock' : 'custom'}`;

            document.getElementById('infoModal').classList.add('open');

            world.controls().autoRotate = false;
            document.getElementById('rotateToggle').selected = false;
        }

        function closeModal(event) {
            if (!event || event.target.id === 'infoModal' || event.target.closest('.modal-close') || event.target.closest('md-filled-button')) {
                document.getElementById('infoModal').classList.remove('open');
            }
        }

        function copyCoordinates() {
            if (!currentSelectedLandmark) return;
            const text = `${currentSelectedLandmark.lat.toFixed(4)}, ${currentSelectedLandmark.lng.toFixed(4)}`;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toastMessage');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            });
        }

        window.addEventListener('resize', () => {
            world.width([window.innerWidth]);
            world.height([window.innerHeight]);
        });
    </script>
</body>

</html>
