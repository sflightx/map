<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="version" content="1.1">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>SFlightX Map</title>

    <link rel="icon" type="image/png" href="https://sflightx.com/resources/v4/database/logo/logo.png">

    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3847112193670696"
        crossorigin="anonymous"></script>

    <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>

    <!-- Global & Page-Specific Stylesheets -->
    <link rel="stylesheet" href="https://sflightx.com/resources/v4/dependency.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #121212;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #e6e1e5;
            -webkit-tap-highlight-color: transparent;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
            background: #1a1a1a;
        }

        /* Leaflet popup dark mode override */
        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background-color: #1c1b1f !important;
            color: #e6e1e5 !important;
            border-radius: 20px !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: #e6e1e5 !important;
            padding: 12px;
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            gap: 12px;
        }

        header > * {
            pointer-events: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(28, 27, 31, 0.85);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo img {
            height: 32px;
            width: auto;
        }

        #menu {
            color: white;
            cursor: pointer;
            font-size: 26px;
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-container md-outlined-text-field {
            --md-outlined-field-container-shape: 16px;
            --md-outlined-field-container-background-color: rgba(28, 27, 31, 0.85);
            width: 280px;
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background-color: #2b2930;
            border-radius: 16px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 2000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .search-suggestions:not([hidden]) {
            display: block;
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #e6e1e5;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .suggestion-item .material-symbols-rounded {
            color: var(--md-sys-color-primary, #d0bcff);
        }

        /* Floating Controls HUD */
        .hud-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: rgba(28, 27, 31, 0.85);
            backdrop-filter: blur(16px);
            padding: 8px 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .filter-chip {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e6e1e5;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
        }

        .filter-chip.active, .filter-chip:hover {
            background: var(--md-sys-color-primary, #6750A4);
            border-color: var(--md-sys-color-primary, #6750A4);
            color: #fff;
        }

        /* Responsive Breakpoints for Phones */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                padding: 8px;
                gap: 8px;
            }

            .controls-wrapper {
                justify-content: space-between;
                width: 100%;
            }

            .search-container {
                flex: 1;
            }

            .search-container md-outlined-text-field {
                width: 100%;
            }

            .logo {
                align-self: flex-start;
            }

            .hud-panel {
                bottom: 16px;
                width: 90%;
                justify-content: center;
                box-sizing: border-box;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <span class="material-symbols-rounded" onclick="toggleSideSheet()" id="menu">menu</span>
            <a href="https://sflightx.com">
                <img src="https://sflightx.com/resources/v4/database/logo/logo.png" alt="sFlightX Logo" />
            </a>
        </div>
        <div class="controls-wrapper">
            <div class="search-container">
                <md-outlined-text-field id="searchField" placeholder="Search locations..." type="search">
                    <md-icon slot="trailing-icon"><span class="material-symbols-rounded">search</span></md-icon>
                </md-outlined-text-field>
                <div id="searchSuggestions" class="search-suggestions" hidden></div>
            </div>
            <div style="display: flex; align-items: center; background: rgba(28, 27, 31, 0.85); backdrop-filter: blur(12px); padding: 4px 10px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1);">
                <span class="material-symbols-rounded" style="font-size: 20px;">dark_mode</span>
                <md-switch id="themeToggle"></md-switch>
            </div>
        </div>
    </header>

    <!-- Floating Filter HUD -->
    <div class="hud-panel">
        <button class="filter-chip active" onclick="filterLandmarks('all', this)">All</button>
        <button class="filter-chip" onclick="filterLandmarks('stock', this)">Stock</button>
        <button class="filter-chip" onclick="filterLandmarks('custom', this)">Custom</button>
        <button class="filter-chip" onclick="resetMapView()" style="display: flex; align-items: center; gap: 4px;"><span class="material-symbols-rounded" style="font-size: 16px;">my_location</span> Reset</button>
    </div>

    <div id="map"></div>

    <!-- Dependencies & Scripts -->
    <script src="https://sflightx.com/resources/v4/dependency.js"></script>
    <script type="module">
        import { renderNavigation } from 'https://sflightx.com/resources/v4/data/drawer/nav-loader.js';
        import { navData } from 'https://sflightx.com/resources/v4/data/drawer/sflightx_com/index.js';
        renderNavigation(navData);
    </script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const w = 1872;
        const h = 936;
        const url = 'https://sflightx.com/resources/v4/database/image/map_sflightx_com/droo_2k.png';

        const imageBounds = [[-h, 0], [0, w]];
        // Locked map boundaries to prevent sideways infinite scrolling
        const mapBounds = [[-h * 1.3, -200], [200, w + 200]];

        let allLandmarks = [];
        let activeMarkers = [];
        const markerList = {};
        const searchField = document.getElementById('searchField');
        const suggestionsBox = document.getElementById('searchSuggestions');

        const map = L.map('map', {
            crs: L.CRS.Simple,
            maxBounds: mapBounds,
            maxBoundsViscosity: 1.0,
            attributionControl: false,
            zoomControl: false,
            zoomSnap: 0.1,
            noWrap: true // Disables infinite sideways repeating
        });

        L.imageOverlay(url, imageBounds).addTo(map);

        const baseMinZoom = map.getBoundsZoom(imageBounds, true);
        const restrictedMinZoom = baseMinZoom + 1; // Twice shorter zoom-out limit

        map.setMinZoom(restrictedMinZoom);
        map.setMaxZoom(4);
        map.setView([-h / 2, w / 2], restrictedMinZoom);

        // --- MAP CLICK LOGGER ---
        map.on('click', function (e) {
            suggestionsBox.hidden = true;
            
            const pixelY = Math.round(-e.latlng.lat);
            const pixelX = Math.round(e.latlng.lng);

            console.group('[Map Clicked Position]');
            console.log(`Exact Pixel Coordinates: X: ${pixelX}, Y: ${pixelY}`);
            console.log(`JSON Format Ready: [${-pixelY}, ${pixelX}]`);
            console.groupEnd();
        });

        // --- SEARCH & FILTER LOGIC ---
        function updateSuggestions(query) {
            if (!query) {
                suggestionsBox.hidden = true;
                if (window.location.hash) {
                    history.replaceState(null, null, window.location.pathname);
                }
                return;
            }

            const lowerQuery = query.toLowerCase();
            const matches = allLandmarks.filter(place =>
                place.name.toLowerCase().includes(lowerQuery)
            );

            if (matches.length > 0) {
                const html = matches.map(place => {
                    const safeName = place.name.replace(/"/g, '&quot;');
                    return `
                    <div class="suggestion-item" data-slug="${place.slug}" data-name="${safeName}">
                        <span class="material-symbols-rounded">location_on</span>
                        <div>
                            <div class="md-typescale-body-medium">${place.name}</div>
                            <div class="md-typescale-body-small" style="opacity: 0.7;">${place.type || 'Location'} • ${place.mode || 'custom'}</div>
                        </div>
                    </div>`;
                }).join('');
                suggestionsBox.innerHTML = html;
                suggestionsBox.hidden = false;
            } else {
                suggestionsBox.hidden = true;
            }
        }

        suggestionsBox.addEventListener('click', (e) => {
            const item = e.target.closest('.suggestion-item');
            if (item) {
                const { slug, name } = item.dataset;
                searchField.value = name;
                suggestionsBox.hidden = true;
                window.location.hash = slug;
            }
        });

        searchField.addEventListener('input', (e) => {
            updateSuggestions(e.target.value);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsBox.hidden = true;
            }
        });

        // --- DATA LOADING & MARKER PLACEMENT ---
        async function loadLandmarks() {
            try {
                const response = await fetch('https://sflightx.com/resources/v4/database/map/landmarks.json?v=' + Date.now());
                const landmarks = await response.json();
                allLandmarks = landmarks;
                renderMarkers(landmarks);
                handleHashLink();
            } catch (error) {
                console.error("Error loading landmarks:", error);
            }
        }

        function renderMarkers(landmarksToRender) {
            activeMarkers.forEach(m => map.removeLayer(m));
            activeMarkers = [];

            landmarksToRender.forEach(place => {
                const colorHex = place.mode === 'stock' ? '#ffcc00' : '#00ffff';
                const materialIcon = L.divIcon({
                    html: `
                        <div style="display: flex; justify-content: center; align-items: center;">
                            <span class="material-symbols-rounded" 
                                  style="font-size: 34px; 
                                         color: ${colorHex}; 
                                         font-variation-settings: 'FILL' 1;
                                         filter: drop-shadow(0 3px 6px rgba(0,0,0,0.7));">
                                location_on
                            </span>
                        </div>`,
                    className: 'custom-material-pin',
                    iconSize: [34, 34],
                    iconAnchor: [17, 34],
                    popupAnchor: [0, -30]
                });

                const marker = L.marker(place.coords, { icon: materialIcon }).addTo(map);

                const popupContent = `
                    <div style="font-family: 'Outfit', sans-serif; padding: 4px; min-width: 200px;">
                        <h3 class="md-typescale-title-medium" style="margin: 0 0 4px 0; color: ${colorHex};">${place.name}</h3>
                        <p class="md-typescale-body-small" style="text-transform: uppercase; opacity: 0.6; margin: 0 0 8px 0; font-weight: 600;">${place.mode || 'custom'} • ${place.type || 'location'}</p>
                        <p class="md-typescale-body-medium" style="margin: 0 0 14px 0; opacity: 0.9;">${place.description || 'No description provided.'}</p>
                        <md-filled-tonal-button onclick="window.location.hash='${place.slug}'">
                            Focus Location
                        </md-filled-tonal-button>
                    </div>
                `;
                marker.bindPopup(popupContent);

                if (place.slug) markerList[place.slug] = marker;
                activeMarkers.push(marker);
            });
        }

        function filterLandmarks(type, btnElement) {
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            btnElement.classList.add('active');

            if (type === 'all') {
                renderMarkers(allLandmarks);
            } else {
                const filtered = allLandmarks.filter(p => p.mode === type);
                renderMarkers(filtered);
            }
        }

        function resetMapView() {
            map.setView([-h / 2, w / 2], restrictedMinZoom);
        }

        function handleHashLink() {
            const hash = decodeURIComponent(window.location.hash.substring(1));
            if (hash && markerList[hash]) {
                const targetMarker = markerList[hash];
                map.setView(targetMarker.getLatLng(), restrictedMinZoom + 1);
                targetMarker.openPopup();

                const place = allLandmarks.find(p => p.slug === hash);
                if (place) {
                    searchField.value = place.name;
                }
            }
        }

        window.addEventListener('hashchange', handleHashLink);
        loadLandmarks();
    </script>
</body>

</html>
